<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GK GS MASTER Computer Test</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 background:#0f172a;color:white;
 font-family:Arial,sans-serif
}
.container{max-width:750px;margin:auto}
header{
 text-align:center;padding:20px;
 background:#1e3a8a;border-radius:12px
}
h1{color:#38bdf8}
.card{
 background:#1e293b;padding:18px;
 margin-top:15px;border-radius:12px
}
button{
 padding:11px 17px;margin:5px;
 border:0;border-radius:7px;
 background:#2563eb;color:white;
 cursor:pointer;font-weight:bold
}
button:disabled{opacity:.5}
.option{
 display:block;padding:13px;
 background:#334155;
 margin:10px 0;border-radius:8px;
 cursor:pointer
}
.option.selected{background:#075985}
#test,#result{display:none}
#timer{font-size:22px;color:#f87171}
.grid{
 display:grid;grid-template-columns:repeat(8,1fr);
 gap:5px;margin-top:15px
}
.grid button{margin:0;padding:10px 3px}
.grid .done{background:#047857}
.grid .active{border:2px solid #38bdf8}
footer{text-align:center;padding:25px 5px}
a{color:#38bdf8}
</style>
</head>

<body>
<div class="container">

<header>
<h1>GK GS MASTER</h1>
<p>Computer Science Mock Test</p>
<p>Moderate + Advanced Level</p>
</header>

<div class="card" id="start">
<h2 id="instruction">Test Instructions</h2>
<p id="instructions">
Total Questions: 40<br>
Time: 20 Minutes<br>
Each Question: 1 Mark<br>
No Negative Marking
</p>

<button onclick="language('en')">English</button>
<button onclick="language('hi')">हिंदी</button>
<br>
<button onclick="startTest()" id="startButton">
START TEST
</button>
</div>

<div id="test" class="card">
<div style="display:flex;justify-content:space-between">
<b id="number"></b>
<b id="timer">20:00</b>
</div>

<hr>
<h3 id="question"></h3>
<div id="options"></div>

<div style="display:flex;justify-content:space-between">
<button onclick="previous()" id="prev">Previous</button>
<button onclick="next()" id="next">Next</button>
</div>

<hr>
<h3>Question Navigation</h3>
<div class="grid" id="grid"></div>

<br>
<button onclick="submitTest()" style="background:#dc2626">
SUBMIT TEST
</button>
</div>

<div class="card" id="result">
<h2>Test Result</h2>
<h1 id="score"></h1>
<p id="details"></p>
<div id="review"></div>
<button onclick="location.reload()">Restart Test</button>
</div>

<footer>
<p>© 2026 GK GS MASTER. All Rights Reserved.</p>
<a href="https://t.me/staticgkgsmaster" target="_blank">
Join Telegram Channel
</a>
</footer>

</div>

<script>

const questions = [
["Which algorithm suffers from Belady's anomaly?","कौन-सा Algorithm Belady's Anomaly से प्रभावित होता है?",["FIFO","LRU","Optimal","LFU"],0],
["Which normal form removes transitive dependency?","कौन-सा Normal Form Transitive Dependency हटाता है?",["1NF","2NF","3NF","BCNF"],2],
["Binary Search time complexity?","Binary Search की Time Complexity?",["O(n)","O(log n)","O(n²)","O(1)"],1],
["Which protocol provides reliable transmission?","Reliable Transmission कौन-सा Protocol देता है?",["UDP","IP","TCP","ARP"],2],
["Which SQL command removes all rows and retains structure?","सभी Rows हटाकर Structure कौन-सा Command रखता है?",["DROP","DELETE","TRUNCATE","REMOVE"],2],
["Which data structure is used in recursion?","Recursion में कौन-सा Data Structure उपयोग होता है?",["Queue","Stack","Tree","Graph"],1],
["Which OSI layer performs routing?","Routing कौन-सी OSI Layer करती है?",["Transport","Network","Session","Data Link"],1],
["Default HTTPS port?","HTTPS का Default Port?",["21","80","443","25"],2],
["Which key uniquely identifies a record?","Record को Uniquely Identify कौन-सी Key करती है?",["Foreign","Primary","Candidate","Composite"],1],
["Which scheduling may cause starvation?","कौन-सी Scheduling Starvation कर सकती है?",["FCFS","Round Robin","Priority","FIFO"],2],
["Output of 15 & 7?","15 & 7 का Output?",["7","8","15","0"],0],
["Which is volatile memory?","Volatile Memory कौन-सी है?",["ROM","SSD","RAM","Flash"],2],
["Shortest path with non-negative weights?","Non-negative Weights में Shortest Path?",["Prim","Dijkstra","Kruskal","DFS"],1],
["Which SQL clause filters grouped records?","Grouped Records को कौन-सा SQL Clause Filter करता है?",["WHERE","ORDER BY","HAVING","DISTINCT"],2],
["Which device operates at Data Link Layer?","Data Link Layer पर कौन-सा Device काम करता है?",["Router","Switch","Repeater","Hub"],1],
["Which technique shares CPU time among processes?","Processes के बीच CPU Time कौन-सी Technique Share करती है?",["Multiprogramming","Spooling","Fragmentation","Booting"],0],
["What does ACID stand for?","ACID का पूरा नाम क्या है?",["Atomicity, Consistency, Isolation, Durability","Access, Control, Integrity, Data","Atomicity, Control, Index, Durability","Accuracy, Consistency, Isolation, Database"],0],
["Which IPv4 class is used for multicast?","Multicast के लिए कौन-सी IPv4 Class है?",["A","B","C","D"],3],
["Which is a hashing collision technique?","Hashing में Collision Technique कौन-सी है?",["Paging","Chaining","Pipelining","Spooling"],1],
["Which compiler phase detects syntax errors?","Syntax Errors कौन-सा Compiler Phase पहचानता है?",["Lexical","Syntax Analysis","Code Generation","Linking"],1],
["Which RAID level uses mirroring?","Mirroring कौन-सा RAID Level करता है?",["RAID 0","RAID 1","RAID 5","RAID 6"],1],
["Which protocol converts domain names into IP?","Domain Name को IP में कौन बदलता है?",["FTP","DNS","SMTP","SNMP"],1],
["Worst-case Quick Sort complexity?","Quick Sort की Worst Case Complexity?",["O(n)","O(n log n)","O(n²)","O(log n)"],2],
["Which key can contain duplicate values?","कौन-सी Key Duplicate Values रख सकती है?",["Primary","Foreign","Candidate","Super"],1],
["Which is not a deadlock condition?","Deadlock की आवश्यक Condition कौन-सी नहीं है?",["Mutual Exclusion","Hold and Wait","Preemption","Circular Wait"],2],
["What does MX record specify?","MX Record क्या बताता है?",["Mail Server","IP","Name Server","Alias"],0],
["Which gate gives 1 only when all inputs are 1?","सभी Inputs 1 होने पर कौन-सा Gate 1 देता है?",["OR","XOR","AND","NOR"],2],
["Which memory is used for CPU cache?","CPU Cache में कौन-सी Memory उपयोग होती है?",["DRAM","SRAM","ROM","EEPROM"],1],
["Which protocol provides secure remote login?","Secure Remote Login कौन-सा Protocol देता है?",["Telnet","FTP","SSH","HTTP"],2],
["Which BST traversal gives sorted order?","BST का कौन-सा Traversal Sorted Order देता है?",["Preorder","Postorder","Inorder","Level Order"],2],
["Which is a NoSQL database?","NoSQL Database कौन-सा है?",["MySQL","Oracle","MongoDB","PostgreSQL"],2],
["Which attack intercepts communication?","Communication को Intercept करने वाला Attack?",["Phishing","Man-in-the-Middle","Brute Force","SQL Injection"],1],
["Which technique prevents external fragmentation?","External Fragmentation रोकने की Technique?",["Paging","Segmentation","Swapping","Compaction"],0],
["What is the function of a linker?","Linker का कार्य क्या है?",["Execute","Combine Object Files","Compile","Manage Memory"],1],
["Which HTTP code means Not Found?","Not Found के लिए HTTP Code?",["200","301","403","404"],3],
["Which method uses the same encryption and decryption key?","एक ही Encryption और Decryption Key कौन-सी Method उपयोग करती है?",["Asymmetric","Symmetric","Hashing","Digital Signature"],1],
["Which normal form requires every determinant to be a candidate key?","हर Determinant का Candidate Key होना किस Normal Form में जरूरी है?",["1NF","2NF","3NF","BCNF"],3],
["Which protocol automatically assigns IP addresses?","IP Address Automatically कौन Assign करता है?",["DNS","DHCP","ARP","ICMP"],1],
["Which structure implements priority queue efficiently?","Priority Queue के लिए Efficient Structure?",["Stack","Linked List","Heap","Graph"],2],
["Complement of A+B in Boolean algebra?","Boolean Algebra में A+B का Complement?",["A'+B'","A'B'","AB","A+B"],1]
];

let current=0;
let answers=Array(40).fill(null);
let time=1200;
let timerInterval=null;
let lang="en";
let finished=false;

function language(l){
lang=l;
document.getElementById("instruction").innerText=
l==="hi"?"परीक्षा के निर्देश":"Test Instructions";
document.getElementById("instructions").innerHTML=
l==="hi"?
"कुल प्रश्न: 40<br>समय: 20 मिनट<br>प्रत्येक प्रश्न: 1 अंक<br>Negative Marking नहीं":
"Total Questions: 40<br>Time: 20 Minutes<br>Each Question: 1 Mark<br>No Negative Marking";
document.getElementById("startButton").innerText=
l==="hi"?"परीक्षा शुरू करें":"START TEST";
if(document.getElementById("test").style.display==="block"){
showQuestion();
}
}

function startTest(){
if(finished)return;
document.getElementById("start").style.display="none";
document.getElementById("test").style.display="block";
current=0;
showQuestion();

clearInterval(timerInterval);
timerInterval=setInterval(function(){
time--;
let m=Math.floor(time/60);
let s=time%60;
document.getElementById("timer").innerText=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
if(time<=0){
submitTest(true);
}
},1000);
}

function showQuestion(){
let q=questions[current];
document.getElementById("number").innerText=
(lang==="hi"?"प्रश्न ":"Question ")+(current+1)+" / 40";

document.getElementById("question").innerText=q[lang==="hi"?1:0];

let html="";
q[2].forEach(function(op,i){
html+=`<label class="option ${answers[current]===i?"selected":""}">
<input type="radio" name="answer" ${answers[current]===i?"checked":""}
onchange="selectAnswer(${i})">
${String.fromCharCode(65+i)}. ${op}
</label>`;
});
document.getElementById("options").innerHTML=html;

document.getElementById("prev").disabled=current===0;
document.getElementById("next").disabled=current===39;
document.getElementById("grid").querySelectorAll("button").forEach(function(b,i){
b.className=(answers[i]!==null?"done ":"")+(i===current?"active":"");
});
}

function selectAnswer(i){
answers[current]=i;
showQuestion();
}

function next(){
if(current<39){
current++;
showQuestion();
}
}

function previous(){
if(current>0){
current--;
showQuestion();
}
}

function createGrid(){
let html="";
for(let i=0;i<40;i++){
html+=<button onclick="goTo(${i})">${i+1}</button>;
}
document.getElementById("grid").innerHTML=html;
}

function goTo(i){
current=i;
showQuestion();
}

function submitTest(auto=false){
if(finished)return;
if(!auto && !confirm("Are you sure you want to submit?"))return;

finished=true;
clearInterval(timerInterval);

let score=0,attempted=0;
questions.forEach(function(q,i){
if(answers[i]!==null)attempted++;
if(answers[i]===q[3])score++;
});

document.getElementById("test").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("score").innerText=score+" / 40";
document.getElementById("details").innerText=
"Attempted: "+attempted+
" | Wrong: "+(attempted-score)+
" | Not Attempted: "+(40-attempted)+
" | Percentage: "+(score/40*100).toFixed(2)+"%";

let html="<h3>Answer Review</h3>";
questions.forEach(function(q,i){
let correct=q[2][q[3]];
let selected=answers[i]===null?"Not Attempted":q[2][answers[i]];
html+=`<div class="card">
<b>Q${i+1}. ${q[lang==="hi"?1:0]}</b><br>
Your Answer: ${selected}<br>
<span style="color:#4ade80">Correct Answer: ${correct}</span>
</div>`;
});
document.getElementById("review").innerHTML=html;
window.scrollTo(0,0);
}

createGrid();

</script>
</body>
</html>
